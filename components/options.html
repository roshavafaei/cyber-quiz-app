<!-- Defult -->
<p class="preview-label">Default — unanswered</p>
<div class="options-grid">
  <button class="card option">
    <span class="option__letter">A</span>
    <span>Jupiter</span>
  </button>
  <button class="card option">
    <span class="option__letter">B</span>
    <span>Saturn</span>
  </button>
  <button class="card option">
    <span class="option__letter">C</span>
    <span>Uranus</span>
  </button>
  <button class="card option">
    <span class="option__letter">D</span>
    <span>Neptune</span>
  </button>
</div>

<!-- Correct -->
<p class="preview-label">Correct answer chosen (.option--correct)</p>
<div class="options-grid">
  <button class="card option" disabled>
    <span class="option__letter">A</span>
    <span>Jupiter</span>
  </button>
  <button class="card option option--correct" disabled>
    <span class="option__letter">B</span>
    <span>Saturn</span>
  </button>
  <button class="card option" disabled>
    <span class="option__letter">C</span>
    <span>Uranus</span>
  </button>
  <button class="card option" disabled>
    <span class="option__letter">D</span>
    <span>Neptune</span>
  </button>
</div>

<!-- Wrong -->
<p class="preview-label">
  Wrong answer chosen (.option--wrong + .option--correct revealed)
</p>
<div class="options-grid">
  <button class="card option option--wrong" disabled>
    <span class="option__letter">A</span>
    <span>Jupiter</span>
  </button>
  <button class="card option option--correct" disabled>
    <span class="option__letter">B</span>
    <span>Saturn</span>
  </button>
  <button class="card option" disabled>
    <span class="option__letter">C</span>
    <span>Uranus</span>
  </button>
  <button class="card option" disabled>
    <span class="option__letter">D</span>
    <span>Neptune</span>
  </button>
</div>

<!-- Timeout -->
<p class="preview-label">Timeout — only correct answer revealed</p>
<div class="options-grid">
  <button class="card option" disabled>
    <span class="option__letter">A</span>
    <span>Jupiter</span>
  </button>
  <button class="card option option--correct" disabled>
    <span class="option__letter">B</span>
    <span>Saturn</span>
  </button>
  <button class="card option" disabled>
    <span class="option__letter">C</span>
    <span>Uranus</span>
  </button>
  <button class="card option" disabled>
    <span class="option__letter">D</span>
    <span>Neptune</span>
  </button>
</div>
