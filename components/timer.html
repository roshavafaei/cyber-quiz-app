<!-- 1st Sample -->
<div class="preview-group">
  <p class="preview-label">Normal (30s)</p>
  <div class="timer">
    <svg viewBox="0 0 44 44" aria-hidden="true">
      <circle class="timer__track" cx="22" cy="22" r="18" />
      <circle
        class="timer__arc"
        cx="22"
        cy="22"
        r="18"
        style="stroke-dashoffset: 0"
      />
    </svg>
    <span class="timer__label">30</span>
  </div>
</div>
