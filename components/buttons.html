<!-- Primary Button -->
<p class="preview-label">btn--primary</p>
<button class="btn btn--primary">
  <span>Start Quiz</span>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <line x1="5" y1="12" x2="19" y2="12" />
    <polyline points="12 5 19 12 12 19" />
  </svg>
</button>


<!-- Ghost Button -->
<p class="preview-label">btn--ghost</p>
<button class="btn btn--ghost">
  <span>Next Question</span>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <line x1="5" y1="12" x2="19" y2="12" />
    <polyline points="12 5 19 12 12 19" />
  </svg>
</button>


<!-- Hidden Button -->
<button class="btn btn--ghost btn--hidden">
  <span>Hidden Button</span>
</button>
